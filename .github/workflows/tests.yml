name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q
      # The evaluation exits with an error if a prompt-injection email reaches the CRM.
      - run: python -m evals.run --gate --out /tmp/report.json
